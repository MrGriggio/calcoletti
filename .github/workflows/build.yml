# Ogni modifica crea in automatico Calcoletti.dmg (scaricabile dalla scheda "Actions").
name: Build Calcoletti
on:
  push:
  workflow_dispatch:
concurrency:
  group: build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Compila app e dmg
        shell: bash
        run: |
          set -o pipefail
          swift --version 2>&1 | tee build.log
          bash build.sh 2>&1 | tee -a build.log
      - name: Collaudo automatico
        shell: bash
        run: |
          set -o pipefail
          build/Calcoletti.app/Contents/MacOS/Calcoletti --selftest --no-shots "$PWD/selftest" 2>&1 | tee selftest.log
      - name: Riepilogo
        if: always()
        shell: bash
        run: |
          {
            cat selftest/report.md 2>/dev/null || { echo '## Collaudo non eseguito'; echo '```'; tail -30 selftest.log 2>/dev/null; echo '```'; }
            echo
            echo '## Log di compilazione'
            echo '```'
            grep -E "error:|warning: .*deprecated|✓|→" build.log | grep -v "warning:" | head -80 || true
            echo '---- coda ----'
            tail -40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pubblica Calcoletti.dmg nella pagina Releases
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          cat > notes.md <<'NOTES'
          **Download `Calcoletti.dmg` below**, open it and drag **Calcoletti** into **Applications**.

          **First launch:** the app isn't signed with an Apple Developer ID, so macOS blocks it the first time. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. Or run in Terminal:
          ```
          xattr -dr com.apple.quarantine /Applications/Calcoletti.app
          ```
          Requires macOS 13 Ventura or later · Apple Silicon & Intel · English and Italian.

          ---

          🇮🇹 **Scarica `Calcoletti.dmg` qui sotto**, aprilo e trascina **Calcoletti** in **Applicazioni**.

          **Primo avvio:** l'app non è firmata con un account sviluppatore Apple, quindi la prima volta macOS la blocca. Apri **Impostazioni di Sistema → Privacy e sicurezza**, scorri in basso e premi **Apri comunque**.
          NOTES
          sed -i '' 's/^          //' notes.md
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest build/Calcoletti.dmg \
            --title "Calcoletti ${VERSION}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

  schermate:
    # Disegna le schermate e i fotogrammi per i video. Non blocca la release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            mode: gpu
          - os: macos-15-intel
            mode: cpu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Compila e scatta schermate e fotogrammi
        shell: bash
        run: |
          mkdir -p shot
          ARCH=$(uname -m)
          xcrun swiftc -O -swift-version 5 -parse-as-library -target ${ARCH}-apple-macos13.0 Sources/*.swift -o shot/Calcoletti
          FLAG=""; [ "${{ matrix.mode }}" = cpu ] && FLAG="--cpu"
          shot/Calcoletti --selftest $FLAG "$PWD/selftest" 2>&1 | tail -40 || echo "selftest: crash"
          for L in it en; do
            D="$PWD/selftest/demo"; [ $L = en ] && D="$PWD/selftest/demo-en"
            shot/Calcoletti --demo $FLAG --lang $L "$D" 2>&1 | tail -3 || echo "demo $L: crash"
            shot/Calcoletti --demo --stills $FLAG --lang $L "$D" 2>&1 | tail -5 || echo "stills $L: crash"
          done
          ls -R selftest | head -20
      - name: Salva nel ramo selftest-${{ matrix.mode }}
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$(ls -A selftest 2>/dev/null)" ] || exit 0
          cat selftest/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cd selftest
          git init -q && git checkout -q -b selftest && git add .
          git -c user.name="Calcoletti CI" -c user.email="ci@users.noreply.github.com" commit -qm "Collaudo di $GITHUB_SHA (${{ matrix.mode }})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" selftest:selftest-${{ matrix.mode }}
